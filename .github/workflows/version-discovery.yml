---
name: Automated Version Discovery
"on":
  schedule:
    # Run twice daily to check for new versions
    - cron: '0 2,14 * * *'  # 02:00 and 14:00 UTC
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      specific_server:
        description: 'Specific server to check (optional, checks all if empty)'
        required: false
        type: string
      create_pr:
        description: 'Create PR for discovered versions'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  discover-versions:
    name: Discover New Versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run version discovery
        id: discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Running Version Discovery ==="

          # Determine which servers to check and run discovery
          if [[ -n "${{ github.event.inputs.specific_server }}" ]]; then
            echo "Checking specific server: ${{ github.event.inputs.specific_server }}"
            python scripts/discover-versions.py --root . \
              --server "${{ github.event.inputs.specific_server }}" > discovery-output.txt 2>&1
          else
            echo "Checking all servers"
            python scripts/discover-versions.py --root . > discovery-output.txt 2>&1
          fi

          echo "Discovery output:"
          cat discovery-output.txt

          # Parse output to determine if new versions were found
          if grep -q "New versions found for" discovery-output.txt; then
            # Extract servers with new versions
            new_version_servers=$(grep "New versions found for" discovery-output.txt | \
              sed 's/.*New versions found for \([^:]*\):.*/\1/' | sort | uniq)

            {
              echo "has_new_versions=true"
              echo "servers_with_updates<<EOF"
              echo "$new_version_servers"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_new_versions=false"
              echo "servers_with_updates="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create version update PRs
        if: steps.discovery.outputs.has_new_versions == 'true' && (github.event.inputs.create_pr != 'false')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Creating Version Update PRs ==="

          # Process each server that has updates
          while IFS= read -r server_name; do
            if [[ -z "$server_name" ]]; then
              continue
            fi

            echo "Processing server: $server_name"

            # Re-run discovery for this specific server to get structured output
            versions_json=$(python3 scripts/parse-discovery-output.py "$server_name")

            if [[ "$versions_json" == "{}" || -z "$versions_json" ]]; then
              echo "No structured version data found for $server_name, skipping PR creation"
              continue
            fi

            echo "Creating PR for $server_name with versions: $versions_json"

            # Create PR using the script
            python scripts/create-version-pr.py \
              --server "$server_name" \
              --versions "$versions_json" \
              --root . || {
              echo "Failed to create PR for $server_name"
              continue
            }

            echo "✅ PR created for $server_name"

          done <<< "${{ steps.discovery.outputs.servers_with_updates }}"

      - name: Summary report
        if: always()
        run: |
          echo "=== Version Discovery Summary ==="

          if [[ "${{ steps.discovery.outputs.has_new_versions }}" == "true" ]]; then
            echo "✅ New versions discovered for the following servers:"
            echo "${{ steps.discovery.outputs.servers_with_updates }}"

            if [[ "${{ github.event.inputs.create_pr }}" != "false" ]]; then
              echo "📝 Pull requests have been created and assigned to @jtdoepke"
            else
              echo "📝 PR creation was disabled - no pull requests created"
            fi
          else
            echo "ℹ️  No new versions discovered"
          fi

          echo ""
          echo "🔍 Discovery ran for:"
          if [[ -n "${{ github.event.inputs.specific_server }}" ]]; then
            echo "  - Specific server: ${{ github.event.inputs.specific_server }}"
          else
            echo "  - All configured servers"
          fi

          echo ""
          echo "📅 Next scheduled discovery: $(date -u -d '+12 hours' '+%Y-%m-%d %H:%M UTC')"

  create-discovery-issue:
    name: Create Discovery Issue
    runs-on: ubuntu-latest
    needs: discover-versions
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write

    steps:
      # Create issue for failed discovery
      - name: Create issue for failed discovery
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = `Version Discovery Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Version Discovery Failure

            The automated version discovery workflow failed during its scheduled run.

            **Failure Details:**
            - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Trigger:** ${{ github.event_name }}
            - **Time:** ${new Date().toISOString()}

            **Next Steps:**
            1. Review the workflow logs to identify the issue
            2. Check if upstream repositories are accessible
            3. Verify GitHub API rate limits haven't been exceeded
            4. Manually trigger the workflow once issues are resolved

            **Assignees:** @jtdoepke

            ---
            *This issue was created automatically by the version discovery workflow.*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              assignees: ['jtdoepke'],
              labels: ['automated', 'version-discovery', 'failure']
            });
